version: '3.8'

services:
  # Frontend - exposed to the public
  frontend:
    image: public.ecr.aws/cardinalhq.io/griffin-commerce-demo:latest
    build: .
    ports:
      - "5173:5173"
    environment:
      - SERVICE_NAME=frontend
      - PORT=5173
      - NODE_ENV=production
      # Browser RUM egress. nginx proxies /v1/traces and /v1/logs to
      # this collector; the SDK ships OTLP-HTTP protobuf.
      - OTEL_COLLECTOR_HOST=${OTEL_COLLECTOR_HOST:-otel-collector}
      - OTEL_COLLECTOR_PORT=${OTEL_COLLECTOR_PORT:-4318}
      - RUM_ENABLED=${RUM_ENABLED:-true}
      - RUM_SERVICE_NAME=${RUM_SERVICE_NAME:-griffin-frontend}
      - RUM_SERVICE_NAMESPACE=${RUM_SERVICE_NAMESPACE:-griffin}
      - RUM_SERVICE_VERSION=${RUM_SERVICE_VERSION:-local}
      # JSON blob; nginx envsubst pastes it verbatim into rum-config.js.
      # Escape curlies so docker-compose doesn't try variable-substitute.
      - RUM_RESOURCE_ATTRIBUTES_JSON={"deployment.environment":"local"}
    depends_on:
      - catalog
      - payment
      - cart
      - shipping
      - images
      - recommendations
      - otel-collector
    networks:
      - griffin-network

  # Fault-injection control plane. Holds the single active knob.
  # GRIFFIN_ADMIN_ENABLED gates mutation endpoints; defaults to false so a
  # compose stack started without explicit opt-in can't be poked. Set
  # GRIFFIN_ADMIN_ENABLED=true (or compose --env) to enable fault injection.
  controlplane:
    image: public.ecr.aws/cardinalhq.io/griffin-commerce-demo:latest
    build: .
    ports:
      - "8086:8086"
    environment:
      - SERVICE_NAME=controlplane
      - PORT=8086
      - GRIFFIN_ADMIN_ENABLED=${GRIFFIN_ADMIN_ENABLED:-false}
    networks:
      - griffin-network
    restart: unless-stopped

  # Backend services - internal only
  catalog:
    image: public.ecr.aws/cardinalhq.io/griffin-commerce-demo:latest
    build: .
    environment:
      - SERVICE_NAME=catalog
      - PORT=8080
      - CONTROLPLANE_URL=http://controlplane:8086
    networks:
      - griffin-network
    restart: unless-stopped

  payment:
    image: public.ecr.aws/cardinalhq.io/griffin-commerce-demo:latest
    build: .
    environment:
      - SERVICE_NAME=payment
      - PORT=8081
      - CONTROLPLANE_URL=http://controlplane:8086
    networks:
      - griffin-network
    restart: unless-stopped

  cart:
    image: public.ecr.aws/cardinalhq.io/griffin-commerce-demo:latest
    build: .
    environment:
      - SERVICE_NAME=cart
      - PORT=8082
      - CATALOG_SERVICE_URL=http://catalog:8080
      - CONTROLPLANE_URL=http://controlplane:8086
    networks:
      - griffin-network
    restart: unless-stopped

  images:
    image: public.ecr.aws/cardinalhq.io/griffin-commerce-demo:latest
    build: .
    environment:
      - SERVICE_NAME=images
      - PORT=8083
      - CONTROLPLANE_URL=http://controlplane:8086
    volumes:
      - ./services/images/static:/app/services/images/static:ro
    networks:
      - griffin-network
    restart: unless-stopped

  shipping:
    image: public.ecr.aws/cardinalhq.io/griffin-commerce-demo:latest
    build: .
    environment:
      - SERVICE_NAME=shipping
      - PORT=8084
      - CONTROLPLANE_URL=http://controlplane:8086
    networks:
      - griffin-network
    restart: unless-stopped

  recommendations:
    image: public.ecr.aws/cardinalhq.io/griffin-commerce-demo:latest
    build: .
    environment:
      - SERVICE_NAME=recommendations
      - PORT=8085
      - CATALOG_SERVICE_URL=http://catalog:8080
      - CONTROLPLANE_URL=http://controlplane:8086
    networks:
      - griffin-network
    restart: unless-stopped

  # Load generator - Locust for simulating user traffic
  loadgen:
    build: ./loadgen
    ports:
      - "8089:8089"  # Locust web UI
    environment:
      - FRONTEND_PROD_HOST=http://frontend:5173
      - LOCUST_USERS=${LOCUST_USERS:-10}
      - LOCUST_SPAWN_RATE=${LOCUST_SPAWN_RATE:-1}
      - LOCUST_RUN_TIME=${LOCUST_RUN_TIME:-60s}
      - LOCUST_FLOOD_MAX_USERS=${LOCUST_FLOOD_MAX_USERS:-500}
      - NORMAL_USER_PCT=${NORMAL_USER_PCT:-60}
      - MOBILE_USER_PCT=${MOBILE_USER_PCT:-30}
      - POWER_USER_PCT=${POWER_USER_PCT:-10}
      - CONTROLPLANE_URL=http://controlplane:8086
    command: >
      locust
      -f /loadgen/locustfile.py
      --host=http://frontend:5173
      --headless
      --users=${LOCUST_USERS:-10}
      --spawn-rate=${LOCUST_SPAWN_RATE:-1}
    depends_on:
      - frontend
    networks:
      - griffin-network
    deploy:
      resources:
        limits:
          memory: 256M  # Limit memory usage
        reservations:
          memory: 128M
    restart: unless-stopped

  # Local OTLP receiver for RUM. Print-to-stderr exporter so you can
  # tail `docker-compose logs -f otel-collector` and watch browser spans
  # flow in as browser-loadgen drives the frontend.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318" # OTLP HTTP (browser SDK)
      - "4317:4317" # OTLP gRPC (backends could point here too)
    networks:
      - griffin-network
    restart: unless-stopped

  # Playwright-driven RUM traffic. See browser-loadgen/README.md.
  browser-loadgen:
    build: ./browser-loadgen
    environment:
      - TARGET_URL=http://frontend:5173
      - CONCURRENCY=${BROWSER_LOADGEN_CONCURRENCY:-2}
      - PAUSE_MIN_MS=${BROWSER_LOADGEN_PAUSE_MIN_MS:-1000}
      - PAUSE_MAX_MS=${BROWSER_LOADGEN_PAUSE_MAX_MS:-5000}
      - CHAOS_ROUTE_PROBABILITY=${BROWSER_LOADGEN_CHAOS_PROBABILITY:-0.05}
      - HEADLESS=true
    depends_on:
      - frontend
    networks:
      - griffin-network
    restart: unless-stopped

networks:
  griffin-network:
    driver: bridge