apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: griffin-commerce-ingress
spec:
  # Uncomment and set to match your cluster's ingress controller.
  # ingressClassName: nginx
  rules:
  # Uncomment host: to restrict to a specific hostname (recommended for
  # production / shared clusters). Leaving it off accepts any hostname.
  # - host: griffin.example.com
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 5173
