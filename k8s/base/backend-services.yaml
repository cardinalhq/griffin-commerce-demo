---
# DBaaS simulator for the Airtel demo. Pure OTLP metric emitter — no Service
# resource because nothing in-cluster talks to it. Polls the controlplane for
# fault knobs (dbaas.disk-full) via CONTROLPLANE_URL (set by the chaos overlay).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbaas
  labels:
    app: dbaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbaas
  template:
    metadata:
      labels:
        app: dbaas
    spec:
      containers:
      - name: dbaas
        image: ghcr.io/cardinalhq/griffin-commerce-demo
        env:
        - name: SERVICE_NAME
          value: "dbaas"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
# Loadgen for the Airtel demo customer-persona flow. Continuous low-rate
# checkout sessions against the cart service so every iteration produces
# a multi-service trace (cart → payment → shipping). When dbaas.disk-full
# is active in the controlplane, the payment leg of these traces returns
# SQLSTATE 53100 — exactly what the customer-side investigate flow needs.
# No HTTP server — outbound client only, so no Service resource.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
      - name: loadgen
        image: ghcr.io/cardinalhq/griffin-commerce-demo
        env:
        - name: SERVICE_NAME
          value: "loadgen"
        - name: CART_URL
          value: "http://cart:8082"
        - name: LOADGEN_RPS
          value: "1"
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
