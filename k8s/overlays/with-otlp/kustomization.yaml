apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Opt-in overlay that enables OTLP export from every backend service.
# Assumes a per-node OpenTelemetry collector listening on 4318/HTTP — i.e. a
# DaemonSet whose Pods accept connections on the Node IP. If your collector
# lives elsewhere (e.g. a cluster Service), edit OTEL_EXPORTER_OTLP_ENDPOINT
# below to point at it (for example "http://otel-collector.observability:4318").

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: catalog
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_SERVICE_NAME
          value: catalog
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://$(HOST_IP):4318"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_INSECURE
          value: "true"
  - target:
      kind: Deployment
      name: payment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
