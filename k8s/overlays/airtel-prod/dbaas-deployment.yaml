apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbaas
  labels:
    app: dbaas
    purpose: airtel-telemetry-simulator
spec:
  replicas: 1
  strategy:
    # Recreate so two pods can't both think they're driving the same
    # scenario. Telemetry continuity isn't important during deploy.
    type: Recreate
  selector:
    matchLabels:
      app: dbaas
  template:
    metadata:
      labels:
        app: dbaas
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dbaas
          image: ghcr.io/cardinalhq/griffin-commerce-demo
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: faults
              containerPort: 9999
              protocol: TCP
          env:
            # entrypoint.sh dispatches by SERVICE_NAME; without this the
            # container boots as `frontend` (nginx) and crashes.
            - name: SERVICE_NAME
              value: "dbaas"
            - name: OTEL_SERVICE_NAME
              value: "dbaas"
            - name: OTEL_RESOURCE_ATTRIBUTES
              # scenario_id + scenario_version match the spec metadata so
              # demo dashboards can filter to this simulator's series.
              value: "scenario_id=airtel_postgres_on_vmware_shared_vm_infra,scenario_version=0.2,deployment.environment=airtel-demo"
            # Send OTLP to the node-local collector DaemonSet (matches the
            # pattern griffin-demo uses today). The collector handles upstream
            # routing + auth, so the pod needs no Cardinal API key.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_INSECURE
              value: "true"
            # Cap log emission cadence to keep the demo log volume sensible.
            - name: DBAAS_LOG_INTERVAL_SEC
              value: "5"
            - name: DBAAS_FAULT_PORT
              value: "9999"
            # Drop the 264-series pg_query_latency_seconds_bucket histogram
            # if cardinality budget is tight. Default true.
            - name: DBAAS_EMIT_PG_HIST
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 10
