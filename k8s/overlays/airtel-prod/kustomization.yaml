apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Standalone overlay for the Airtel telemetry simulator running in the
# lakerunner aws-prod-us-east-2-global cluster. Does NOT depend on
# k8s/base — base bundles the commerce services (catalog, cart, frontend,
# etc.) which are unrelated to the Airtel demo. We ship only the dbaas
# Deployment, a ClusterIP Service for the fault HTTP endpoint, and a
# Namespace.
namespace: airtel-demo

resources:
  - namespace.yaml
  - dbaas-deployment.yaml
  - dbaas-service.yaml

images:
  - name: ghcr.io/cardinalhq/griffin-commerce-demo
    newTag: latest
