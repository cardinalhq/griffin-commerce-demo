apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvcf
  labels:
    app: nvcf
    purpose: nvcf-telemetry-simulator
spec:
  replicas: 1
  strategy:
    # Recreate so two pods can't both think they're driving the same
    # chaos knob. Telemetry continuity isn't important during deploy.
    type: Recreate
  selector:
    matchLabels:
      app: nvcf
  template:
    metadata:
      labels:
        app: nvcf
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nvcf
          image: ghcr.io/cardinalhq/griffin-commerce-demo
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: faults
              containerPort: 9998
              protocol: TCP
          env:
            # entrypoint.sh dispatches by SERVICE_NAME; without this the
            # container boots as `frontend` (nginx) and crashes.
            - name: SERVICE_NAME
              value: "nvcf"
            - name: OTEL_SERVICE_NAME
              value: "nvcf"
            - name: OTEL_RESOURCE_ATTRIBUTES
              # scenario_id + scenario_version match docs/specs/nvcf.md so
              # demo dashboards can filter to this simulator's series.
              value: "scenario_id=nvcf_gpu_inference_simulator,scenario_version=0.1,deployment.environment=nvcf-demo"
            # Send OTLP directly to the Cardinal SaaS intake with the
            # "Cardinal HQ - Demo" org's "Demo Apps" ingest key so segments
            # land in 6d69ff5f-d386-491e-a715-306a8f172b53 — the org the
            # NVCF dashboards live in. The node-local agent DaemonSet would
            # tag segments to the parent Cardinal HQ org instead, which is
            # how the first deploy ended up invisible to the demo dashboards.
            #
            # The API key is held in Secret nvcf-cardinal-ingest (key
            # OTEL_EXPORTER_OTLP_HEADERS, value
            #   x-cardinalhq-api-key=<demo-apps-key>). One-shot create per
            # cluster — see k8s/overlays/nvcf-prod/README.md for the exact
            # kubectl invocation; the plaintext key lives in
            # maestro.maestro_ingest_api_keys for
            # org_id=6d69ff5f-... name='Demo Apps'.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "https://otelhttp.intake.us-east-2.aws.cardinalhq.io"
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: nvcf-cardinal-ingest
                  key: OTEL_EXPORTER_OTLP_HEADERS
            # 10s metric export — a 1m rate window then has 6 samples;
            # the SDK default of 60s gives 1–2 samples per [1m] and the
            # dashboards plot counter rates as a square wave.
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "10000"
            # Fault HTTP port. Matches services/nvcf/httpserver.go default.
            - name: NVCF_FAULT_PORT
              value: "9998"
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9998
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9998
            initialDelaySeconds: 5
            periodSeconds: 10
