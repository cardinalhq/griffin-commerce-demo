apiVersion: apps/v1
kind: Deployment
metadata:
  name: solar
  labels:
    app: solar
    purpose: adani-solar-telemetry-simulator
spec:
  replicas: 1
  strategy:
    # Recreate so two pods can't both think they're driving the same
    # scenario. Telemetry continuity isn't important during deploy.
    type: Recreate
  selector:
    matchLabels:
      app: solar
  template:
    metadata:
      labels:
        app: solar
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: solar
          image: ghcr.io/cardinalhq/griffin-commerce-demo
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: faults
              containerPort: 9999
              protocol: TCP
          env:
            # entrypoint.sh dispatches by SERVICE_NAME; without this the
            # container boots as `frontend` (nginx) and crashes.
            - name: SERVICE_NAME
              value: "solar"
            - name: OTEL_SERVICE_NAME
              value: "solar"
            - name: OTEL_RESOURCE_ATTRIBUTES
              # scenario_id + scenario_version match the spec metadata so
              # demo dashboards can filter to this simulator's series.
              value: "scenario_id=adani_khavda_solar_park,scenario_version=0.1,deployment.environment=adani-demo"
            # Send OTLP to the node-local collector DaemonSet (matches the
            # pattern griffin-demo + airtel-demo use today). The collector
            # handles upstream routing + auth, so the pod needs no Cardinal
            # API key.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_INSECURE
              value: "true"
            # 10s metric export so a 1m rate window has 6 samples; the
            # default 60s gives 1-2 samples per [1m] and dashboards
            # plot a counter rate as a square wave.
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "10000"
            # Cap log emission cadence to keep the demo log volume sensible.
            - name: SOLAR_LOG_INTERVAL_SEC
              value: "5"
            - name: SOLAR_FAULT_PORT
              value: "9999"
            # Default true — set false to drop the per-inverter family
            # (96 inverters × 13 metrics) and rely on station rollups.
            - name: SOLAR_EMIT_PER_INVERTER
              value: "true"
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 10
