          value: "http://$(HOST_IP):4318"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_INSECURE
          value: "true"
  - target:
      kind: Deployment
      name: cart
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_SERVICE_NAME
          value: cart
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://$(HOST_IP):4318"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_INSECURE
          value: "true"
  - target:
      kind: Deployment
      name: images
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_SERVICE_NAME
          value: images
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://$(HOST_IP):4318"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_INSECURE
          value: "true"
  - target:
      kind: Deployment
      name: shipping
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HOST_IP
          valueFrom:
