# Fault-injection control plane. Single-replica by design — the active
# knob is held in memory and horizontal scale would split the
# single-knob-at-a-time invariant. strategy.type: Recreate avoids the
# brief "two replicas alive" window that RollingUpdate produces.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane
  labels:
    app: controlplane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: controlplane
  template:
    metadata:
      labels:
        app: controlplane
    spec:
      containers:
        - name: controlplane
          image: ghcr.io/cardinalhq/griffin-commerce-demo
          ports:
            - containerPort: 8086
          env:
            - name: SERVICE_NAME
              value: "controlplane"
            - name: PORT
              value: "8086"
            - name: GRIFFIN_ADMIN_ENABLED
              value: "true"
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: controlplane
spec:
  selector:
    app: controlplane
  ports:
    - port: 8086
      targetPort: 8086
  type: ClusterIP
