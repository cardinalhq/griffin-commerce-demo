apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Opt-in overlay that enables OTLP export against a single user-supplied URL.
#
# Use this when the collector is reachable as a regular Kubernetes Service
# (in-cluster), as a route/Ingress hostname, or as any external HTTPS URL.
# Each backend gets the same endpoint — replace the placeholder below with
# the URL you want.
#
# This is the recommended overlay on OpenShift, where pod-to-Node-IP traffic
# can be restricted by SCCs / network policy and the per-node DaemonSet +
# hostPort pattern (used by `with-otlp-nodelocal`) is awkward.

resources:
  - ../../base

# EDIT ME: the OTLP endpoint every backend will export to.
# Examples:
#   http://otel-collector.observability.svc.cluster.local:4318  (in-cluster Service)
#   https://otel.example.com                                    (external endpoint)
# Set OTEL_INSECURE=true for plain HTTP, leave it unset for HTTPS.

patches:
  - target:
      kind: Deployment
      name: catalog
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_SERVICE_NAME
          value: catalog
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.observability.svc.cluster.local:4318"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_INSECURE
          value: "true"
  - target:
      kind: Deployment
      name: payment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_SERVICE_NAME
